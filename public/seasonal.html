    // 展開或收攏全景卡片
    // 展開或收攏全景卡片
    function toggleExploreCard(id) {
      const details = document.getElementById(`details-${id}`);
      const arrow = document.getElementById(`arrow-${id}`);
      const isHidden = details.classList.contains('hidden');

      if (isHidden) {
        details.classList.remove('hidden');
        arrow.style.transform = 'rotate(180deg)';
        setTimeout(() => initChartForEvent(id), 100);
      } else {
        details.classList.add('hidden');
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    // 切換卡片內的子標籤 (由來、交通、混雜度)
    function switchSubTab(id, type) {
      const subTabs = ['history', 'transit', 'crowd'];
      subTabs.forEach(tab => {
        const btn = document.getElementById(`btn-sub-${id}-${tab}`);
        const content = document.getElementById(`content-sub-${id}-${tab}`);

        if (tab === type) {
          btn.className = "py-3 px-4 border-b-2 zohiko-gold-border zohiko-gold font-bold";
          content.classList.remove('hidden');
          if (tab === 'crowd') {
            setTimeout(() => {
              if (chartInstances[id]) chartInstances[id].update();
            }, 50);
          }
        } else {
          btn.className = "py-3 px-4 border-b-2 border-transparent text-neutral-400 font-bold";
          content.classList.add('hidden');
        }
      });
    }

    // 渲染 Chart.js 歷史混雜數據線圖
    function initChartForEvent(id) {
      if (chartInstances[id]) return;

      const ev = EVENTS_DATA.find(e => e.id === id);
      const canvas = document.getElementById(`chart-${id}`);
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      chartInstances[id] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ev.crowdLabels,
          datasets: [{
            data: ev.crowdTrend,
            borderColor: '#E5C158',
            backgroundColor: 'rgba(229, 193, 88, 0.04)',
            borderWidth: 2,
            pointBackgroundColor: '#C82E2E',
            pointBorderColor: '#E5C158',
            pointRadius: 4,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#121212',
              titleColor: '#E5C158',
              bodyColor: '#f5f5f5',
              borderColor: '#E5C158',
              borderWidth: 1,
              padding: 10,
              displayColors: false,
              callbacks: {
                label: function(context) {
                  return `歷史飽和度: ${context.parsed.y}%`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.03)' },
              ticks: { color: '#888', font: { size: 10 } }
            },
            y: {
              min: 0,
              max: 100,
              grid: { color: 'rgba(255, 255, 255, 0.03)' },
              ticks: { 
                color: '#888', 
                font: { size: 10 },
                callback: function(value) { return value + '%'; }
              }
            }
          }
        }
      });
    }

            : 'border-neutral-800 bg-neutral-950/40 hover:border-neutral-700'
        }`;
        btn.id = `cal-btn-${day.date}`;
        btn.onclick = () => selectCalendarDate(day.date);

        let dotHtml = '';
        if (day.isPeak) {
          dotHtml = `<span class="w-1.5 h-1.5 rounded-full zohiko-vermilion-bg mt-1"></span>`;
        } else if (day.hasEvent) {
          dotHtml = `<span class="w-1.5 h-1.5 rounded-full zohiko-gold-bg mt-1"></span>`;
        } else {
          dotHtml = `<span class="w-1.5 h-1.5 rounded-full bg-transparent mt-1"></span>`;

        btn.innerHTML = `
          <span class="text-[11px] text-neutral-500 font-medium block">${day.week}</span>

          ${dotHtml}

        container.appendChild(btn);
      });

                當日行程跨越兩個城市。建議於 <strong class="text-neutral-200">14:15</strong> 離開京都兩足院或平安神宮，步行至祇園四條，搭乘京阪本線前往 <strong class="text-neutral-200">中書島</strong>，再轉宇治線至 <strong class="text-neutral-200">宇治站</strong>。抵達宇治約為 15:30，正好可在表參道悠閒散步，隨後等待深夜大祭。
              </p>
            </div>
          `;
          container.appendChild(transCard);
        }
      });
    }
  </script>
